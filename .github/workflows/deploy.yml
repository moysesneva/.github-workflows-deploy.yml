name: Deploy VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions: {}

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/zapcna
            git fetch --all
            git reset --hard origin/main
            docker compose down
            docker compose build --no-cache
            docker compose up -d
            sleep 10
            curl -f http://localhost:3000/health
